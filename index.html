<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TicTacToe</title>
</head>
<body>
    <h1 class="title">Welcome to Tic Tac Toe!</h1>
    <div class="board">
        <div class="cell" id="0"><h1 class="text"></h1></div>
        <div class="cell" id="1"><h1 class="text"></h1></div>
        <div class="cell" id="2"><h1 class="text"></h1></div>
        <div class="cell" id="3"><h1 class="text"></h1></div>
        <div class="cell" id="4"><h1 class="text"></h1></div>
        <div class="cell" id="5"><h1 class="text"></h1></div>
        <div class="cell" id="6"><h1 class="text"></h1></div>
        <div class="cell" id="7"><h1 class="text"></h1></div>
        <div class="cell" id="8"><h1 class="text"></h1></div>
    </div>

    <h2 class="status">TURN: X</h2>
    <div class="playagain">
        <button class="restart hidden">Play Again</button>
    </div>
    



    <script src="app.js"></script>
</body>
</html>
